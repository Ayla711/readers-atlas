<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Reader's Atlas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="js/vendor/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css?v=40">
</head>
<body class="is-loading panel-closed">
    <a class="skip-link" href="#panel" data-i18n="skipToPanel">Skip to the panel</a>

  <main class="layout">
    <section class="map-pane" data-i18n-aria="mapLabel">
      <div id="basemap" class="basemap" aria-hidden="true"></div>
      <svg id="map" role="group" data-i18n-aria="mapLabel"></svg>
      <div class="frame" aria-hidden="true"></div>
      <div class="titleblock">
        <h2 class="map-title" id="map-title"></h2>
        <div class="crumbs" id="crumbs"></div>
        <div class="focus-chip" id="focus-chip" hidden></div>
      </div>
      <svg class="compass" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="22" class="c-ring"/>
        <circle cx="32" cy="32" r="18" class="c-ring thin"/>
        <path d="M32 11 L36 32 L32 30 L28 32 Z" class="c-north"/>
        <path d="M32 53 L28 32 L32 34 L36 32 Z" class="c-south"/>
        <text x="32" y="8" class="c-n">N</text>
      </svg>
      <div class="map-controls">
        <button id="zoom-in" data-i18n-aria="zoomIn">+</button>
        <button id="zoom-out" data-i18n-aria="zoomOut">−</button>
        <button id="zoom-uk" class="reset" data-i18n-aria="zoomUK" data-i18n-title="zoomUK">⤢</button>
      </div>
      <fieldset class="legend" id="legend">
        <legend class="visually-hidden" data-i18n="legendLabel"></legend>
      </fieldset>
      <div class="tooltip" id="tooltip" hidden></div>
      <div class="cover" aria-hidden="true">
        <div class="cover-title"><h2 class="cover-name">The Reader's Atlas</h2><p class="cover-tagline" data-i18n="introTagline"></p></div>
        <p class="cover-hint" data-i18n="coverHint"></p>
      </div>
      <p class="attribution">Streets: <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> © <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a> · © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors · Regions: Natural Earth</p>
    </section>

    <button id="panel-open" class="panel-handle" aria-controls="panel" aria-expanded="false" data-i18n-aria="openPanel">
      <span class="ph-chevron" aria-hidden="true">‹</span><span class="ph-label" data-i18n="openPanelShort"></span>
    </button>
    <aside class="panel" id="panel">
      <button id="panel-close" class="panel-close" data-i18n-aria="closePanel" data-i18n-title="closePanel"><span aria-hidden="true">›</span></button>
      <div class="panel-head">
        <h1 class="brand"><span class="brand-en">The Reader's Atlas</span><span class="brand-zh" data-i18n="brandSub"></span></h1>
      </div>
      <div class="panel-tools">
        <div class="search">
          <label for="search-input" class="visually-hidden" data-i18n="searchLabel"></label>
          <input id="search-input" type="search" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-results" data-i18n-placeholder="searchPlaceholder">
          <ul id="search-results" class="search-results" role="listbox" hidden></ul>
        </div>
        <div class="tab-row">
          <nav class="tabs" data-i18n-aria="tabsLabel">
            <button class="tab is-active" data-view="map" data-i18n="tabMap"></button>
            <button class="tab" data-view="travel" data-i18n="tabTravel"></button>
            <button class="tab" data-view="reading" data-i18n="tabReading"></button>
          </nav>
          <button id="lang-toggle" class="lang-toggle" data-i18n="toggle" data-i18n-aria="toggleLabel"></button>
        </div>
      </div>
      <div class="reader" id="reader" aria-live="polite"></div>
    </aside>
  </main>

  <dialog id="trip-dialog" class="trip-dialog">
    <form method="dialog" id="trip-form">
      <h2 id="trip-title"></h2>
      <label><span data-i18n="date"></span> <input type="date" name="date" required></label>
      <label><span data-i18n="note"></span> <input type="text" name="note" data-i18n-placeholder="notePlaceholder"></label>
      <div class="dialog-actions">
        <button value="cancel" formnovalidate class="ghost" data-i18n="cancel"></button>
        <button value="ok" class="solid" data-i18n="confirmTrip"></button>
      </div>
    </form>
  </dialog>

  <dialog id="journal-dialog" class="trip-dialog journal-dialog" aria-labelledby="j-title">
    <form id="journal-form" novalidate>
      <h2 id="j-title"></h2>
      <div class="j-daterow">
        <label><span id="j-l-date"></span> <input type="date" id="j-date"></label>
        <label class="j-mode"><span class="sr-only" id="j-l-mode"></span><select id="j-date-mode"><option value="day" id="j-o-day"></option><option value="month" id="j-o-month"></option><option value="year" id="j-o-year"></option></select></label>
      </div>
      <label><span id="j-l-text"></span> <textarea id="j-text" rows="6" maxlength="5000"></textarea></label>
      <div class="j-field">
        <span class="j-label" id="j-l-photos"></span>
        <label class="j-drop" id="j-drop"><input type="file" id="j-file" accept="image/*" multiple><span id="j-drop-hint"></span></label>
        <ul class="j-photo-list" id="j-photo-list"></ul>
      </div>
      <div class="j-field">
        <span class="j-label" id="j-l-books"></span>
        <div class="j-book-list" id="j-books"></div>
      </div>
      <p class="j-error" id="j-error" role="alert"></p>
      <div class="j-discard" id="j-discard" hidden>
        <span id="j-discard-msg"></span>
        <button type="button" class="ghost" id="j-discard-no"></button>
        <button type="button" class="solid" id="j-discard-yes"></button>
      </div>
      <div class="dialog-actions">
        <button type="button" class="ghost" id="j-cancel"></button>
        <button type="submit" class="solid" id="j-save"></button>
      </div>
    </form>
  </dialog>

  <dialog id="ask-dialog" class="trip-dialog ask-dialog">
    <form method="dialog">
      <p id="ask-msg"></p>
      <div class="dialog-actions">
        <button value="no" class="ghost" id="ask-no"></button>
        <button value="yes" class="solid" id="ask-yes"></button>
      </div>
    </form>
  </dialog>

  <dialog id="lightbox" class="lightbox">
    <button type="button" class="lb-close" id="lb-close">×</button>
    <figure>
      <img id="lb-img" alt="">
      <figcaption><span id="lb-caption"></span><span class="lb-count" id="lb-count"></span></figcaption>
    </figure>
    <button type="button" class="lb-nav lb-prev" id="lb-prev">‹</button>
    <button type="button" class="lb-nav lb-next" id="lb-next">›</button>
  </dialog>

  <script src="data/world-geo.js?v=4"></script>
  <script src="data/countries.js?v=6"></script>
  <script src="data/intro-geo.js?v=2"></script>
  <script src="js/vendor/maplibre-gl.js"></script>
  <script src="js/basemap.js?v=13"></script>
  <script src="js/i18n.js?v=36"></script>
  <script src="js/intro.js?v=11"></script>
  <!-- data.js loads each country's data files (data/<code>/…) on demand; data-v is their cache-busting version -->
  <script src="js/data.js?v=1" data-v="39"></script>
  <script src="js/store.js?v=1"></script>
  <script src="js/journal-store.js?v=2"></script>
  <script src="js/shelf.js?v=12"></script>
  <script src="js/sounds.js?v=2"></script>
  <script src="js/bookopen.js?v=3"></script>
  <script src="js/app.js?v=60"></script>
</body>
</html>
